name: Ansible deploy

on:
  push:
    branches:
      - master
    paths:
      - 'ansible/**'
  workflow_dispatch:

# Le runner self-hosted ne fait que déclencher le Job Template AWX : toute la logique vit dans AWX.
# Secrets requis : AWX_HOST (ex. http://192.168.122.148:30080) et AWX_TOKEN (token OAuth AWX, scope write).
jobs:
  deploy:
    runs-on: self-hosted
    env:
      AWX_HOST: ${{ secrets.AWX_HOST }}
      AWX_TOKEN: ${{ secrets.AWX_TOKEN }}
      JOB_TEMPLATE: lab-site

    steps:
      - name: Lancer le Job Template AWX
        id: launch
        run: |
          api() { curl -sSf -H "Authorization: Bearer $AWX_TOKEN" -H "Content-Type: application/json" "$@"; }
          JT_ID=$(api "$AWX_HOST/api/v2/job_templates/?name=$JOB_TEMPLATE" | jq -er '.results[0].id')
          JOB_ID=$(api -X POST "$AWX_HOST/api/v2/job_templates/$JT_ID/launch/" | jq -er '.job')
          echo "Job AWX $JOB_ID lancé : $AWX_HOST/#/jobs/playbook/$JOB_ID/output"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Attendre la fin du job
        timeout-minutes: 30
        run: |
          api() { curl -sSf -H "Authorization: Bearer $AWX_TOKEN" "$@"; }
          JOB_ID=${{ steps.launch.outputs.job_id }}
          while :; do
            STATUS=$(api "$AWX_HOST/api/v2/jobs/$JOB_ID/" | jq -r '.status')
            case "$STATUS" in
              successful) echo "Job $JOB_ID : succès"; break ;;
              failed|error|canceled)
                api "$AWX_HOST/api/v2/jobs/$JOB_ID/stdout/?format=txt" | tail -n 50
                echo "Job $JOB_ID : $STATUS"; exit 1 ;;
              *) sleep 10 ;;
            esac
          done
