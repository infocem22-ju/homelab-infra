---
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true

- name: Check router interfaces
  ansible.builtin.assert:
    that:
      - host_firewall_router.wan_if in ansible_interfaces
      - host_firewall_router.lan_if in ansible_interfaces
    fail_msg: "Interfaces de la VM : {{ ansible_interfaces | join(', ') }}"
    quiet: true
  when: host_firewall_router | length > 0

# Sans routage IP, le noyau jette tout ce qui n'est pas pour la machine elle-même.
- name: Enable IPv4 forwarding
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-host-firewall-router.conf
    content: "net.ipv4.ip_forward = 1\n"
    mode: "0644"
  register: host_firewall_sysctl
  when: host_firewall_router | length > 0

- name: Apply IPv4 forwarding
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-host-firewall-router.conf
  changed_when: true
  when: host_firewall_sysctl is changed

- name: Deploy nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0755"
    backup: true
    validate: nft -c -f %s
  register: host_firewall_conf

- name: Apply ruleset with automatic rollback
  ansible.builtin.include_tasks: apply.yml
  when: host_firewall_conf is changed

# Une règle ajoutée à la main ne modifie pas le fichier : sans ce rechargement, le rôle
# ne verrait jamais une dérive des règles chargées. Le fichier ayant déjà été validé
# par un passage précédent, pas besoin de retour arrière ici.
- name: Reload ruleset (fixes manual drift)
  ansible.builtin.shell: |
    set -e
    before="$(nft list ruleset)"
    nft -f /etc/nftables.conf
    [ "$before" = "$(nft list ruleset)" ] || echo DRIFT
  args:
    executable: /bin/bash
  register: host_firewall_reload
  changed_when: "'DRIFT' in host_firewall_reload.stdout"
  when: host_firewall_conf is not changed

# Le service recharge /etc/nftables.conf au démarrage de la VM.
- name: Enable nftables service
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
