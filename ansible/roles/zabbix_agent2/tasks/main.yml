---
- name: Dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - wget
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Download Zabbix release package (Debian 12)
  ansible.builtin.get_url:
    url: "{{ zbx_repo_deb_url }}"
    dest: /tmp/zabbix-release.deb
    mode: "0644"

- name: Install Zabbix release package
  ansible.builtin.apt:
    deb: /tmp/zabbix-release.deb

- name: Install zabbix-agent2
  ansible.builtin.apt:
    name: zabbix-agent2
    state: present
    update_cache: true

- name: Ensure log dir exists
  ansible.builtin.file:
    path: "{{ zbx_log_dir }}"
    state: directory
    mode: "0755"

- name: Configure zabbix-agent2
  ansible.builtin.template:
    src: zabbix_agent2.conf.j2
    dest: /etc/zabbix/zabbix_agent2.conf
    mode: "0644"

# Inclus par Include=/etc/zabbix/zabbix_agent2.d/*.conf ; supprimé si la liste est vide.
- name: Deploy UserParameters
  ansible.builtin.copy:
    dest: /etc/zabbix/zabbix_agent2.d/homelab.conf
    content: |
      # Ansible managed (rôle zabbix_agent2, zbx_userparameters)
      {% for p in zbx_userparameters %}
      UserParameter={{ p.key }},{{ p.command }}
      {% endfor %}
    mode: "0644"
  when: zbx_userparameters | length > 0

- name: Remove UserParameters
  ansible.builtin.file:
    path: /etc/zabbix/zabbix_agent2.d/homelab.conf
    state: absent
  when: zbx_userparameters | length == 0

# Commandes exactes, arguments compris : l'agent ne peut rien lancer d'autre en root.
- name: Allow agent commands as root
  ansible.builtin.copy:
    dest: /etc/sudoers.d/zabbix-agent
    content: |
      # Ansible managed (rôle zabbix_agent2, zbx_sudo_commands)
      {% for c in zbx_sudo_commands %}
      zabbix ALL=(root) NOPASSWD: {{ c }}
      {% endfor %}
    mode: "0440"
    validate: visudo -cf %s
  when: zbx_sudo_commands | length > 0

- name: Remove agent sudoers
  ansible.builtin.file:
    path: /etc/sudoers.d/zabbix-agent
    state: absent
  when: zbx_sudo_commands | length == 0

- name: Restart zabbix_agent2 (no systemd)
  ansible.builtin.shell: |
    set -e
    pkill -x zabbix_agent2 2>/dev/null || true
    nohup zabbix_agent2 >/dev/null 2>&1 &
  args:
    executable: /bin/bash
  changed_when: true
  when: not (zbx_use_systemd | default(false))

- name: Clean up stale PID file (if any)
  ansible.builtin.file:
    path: /tmp/zabbix_agent2.pid
    state: absent
  when: zbx_use_systemd | default(false)

- name: Enable and start zabbix-agent2 (systemd)
  ansible.builtin.systemd:
    name: zabbix-agent2
    enabled: true
    state: restarted
  when: zbx_use_systemd | default(false)

- name: Wait for agent2 to listen on 10050 locally
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 10050
    timeout: 15