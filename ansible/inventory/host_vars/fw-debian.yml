# Pare-feu Debian + nftables (site B), pendant d'OPNsense : voir docs/pare-feu.md.
# WAN sur vmbr0 (192.168.122.120), LAN 10.10.20.0/24 sur vmbr2.
# vmbr2 est VLAN aware : eth1 porte le LAN non étiqueté et le VLAN 40 (invités, 10.10.41.0/24).
host_firewall_enabled: true

# Le pare-feu lui-même : SSH d'administration seulement.
host_firewall_rules:
  - name: SSH depuis AWX et l'hôte
    proto: tcp
    port: 22
    sources:
      - 192.168.122.148
      - 192.168.122.1
  # Services du LAN (rôle dnsmasq_lan), jamais côté WAN.
  - name: DNS du LAN (UDP)
    proto: udp
    port: 53
    iif: eth1
  - name: DNS du LAN (TCP)
    proto: tcp
    port: 53
    iif: eth1
  - name: DHCP du LAN
    proto: udp
    port: 67
    iif: eth1
  - name: DNS des invités (UDP)
    proto: udp
    port: 53
    iif: eth1.40
  - name: DNS des invités (TCP)
    proto: tcp
    port: 53
    iif: eth1.40
  - name: DHCP des invités
    proto: udp
    port: 67
    iif: eth1.40
  # Entrée du tunnel de télétravail (rôle wireguard_server), comme la règle 620 d'OPNsense.
  - name: WireGuard teletravail
    proto: udp
    port: 51820
    iif: eth0

host_firewall_router:
  wan_if: eth0
  lan_if: eth1
  lan_net: 10.10.20.0/24
  # Accès d'administration au LAN (route 10.10.20.0/24 via .120 sur AWX et l'hôte).
  forward_rules:
    - name: SSH admin vers le LAN
      proto: tcp
      port: 22
      sources:
        - 192.168.122.148
        - 192.168.122.1
    - name: Ping admin vers le LAN
      proto: icmp
      sources:
        - 192.168.122.148
        - 192.168.122.1
  # Comme INVITES (VLAN 40) sur OPNsense : Internet seulement, aucun accès d'administration.
  guests:
    - name: invites
      if: eth1.40
      net: 10.10.41.0/24
      allow:
        - name: sortie HTTP
          port: 80
        - name: sortie HTTPS
          port: 443
        - name: NTP
          proto: udp
          port: 123
        - name: ping vers Internet
          proto: icmp
  # Comme l'instance teletravail d'OPNsense : les télétravailleurs n'atteignent que le LAN.
  tunnels:
    - name: teletravail
      if: wg0
      net: 10.10.98.0/24
      to:
        - 10.10.20.0/24
  # IPsec site à site (rôle ipsec_site) : IKE et ESP depuis le pair seulement,
  # et seul le réseau distant, arrivé par le tunnel, entre dans le LAN.
  ipsec:
    - name: site A
      peer: 192.168.122.119
      remote_net: 10.10.10.0/24
  # Comme lab-vm-1 derrière OPNsense : le client ne connaît que l'adresse WAN.
  port_forwards:
    - name: Site de lab-vm-3
      proto: tcp
      port: 80
      to: 10.10.20.101
# VLAN invités : même numéro que sur OPNsense (un tag n'a de sens que dans son site),
# mais sous-réseau propre au site B (10.10.40.0/24 est au site A) : pas de chevauchement
# quand les deux sites seront reliés par IPsec.
lan_vlans:
  - id: 40
    link: eth1
    address: 10.10.41.1/24

# WireGuard (télétravail), pendant de l'instance teletravail d'OPNsense. Réseau de tunnel
# distinct de celui du site A (10.10.99.0/24) : pas de chevauchement entre les sites.
wireguard_server_enabled: true
wireguard_server_address: 10.10.98.1/24
wireguard_server_peers:
  - name: lab-vm-2
    pubkey: Qk4nVF0KOUWuWjy3tviUczRRNGURi/TI6rn4IVuAnQU=
    address: 10.10.98.2/32

# DHCP et DNS du LAN, comme le Dnsmasq d'OPNsense sur le site A.
dnsmasq_lan_interface: eth1
dnsmasq_lan_address: 10.10.20.1
dnsmasq_lan_vlans:
  - name: invites
    interface: eth1.40
    address: 10.10.41.1
    start: 10.10.41.200
    end: 10.10.41.249
dnsmasq_lan_domain: siteb.lab
dnsmasq_lan_hosts:
  - name: fw-debian
    ip: 10.10.20.1
  - name: lab-vm-3
    ip: 10.10.20.101

# IPsec site à site avec OPNsense (site A, tools/opnsense_ipsec.py) : LAN à LAN seulement,
# les invités (10.10.41.0/24 ici, 10.10.40.0/24 là-bas) et la DMZ restent hors du tunnel.
ipsec_site_enabled: true
ipsec_site_name: site-b
ipsec_site_local_addr: 192.168.122.120
ipsec_site_peers:
  - name: site-a
    addr: 192.168.122.119
    local_ts: [10.10.20.0/24]
    remote_ts: [10.10.10.0/24]
    # Paire générée par OPNsense (tools/opnsense_ipsec.py, qui affiche cette clé).
    pubkey: |
      -----BEGIN PUBLIC KEY-----
      MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA4iW+p7ho0vvPOy0Y2ECc
      A6koBjUZMSMvIB1ERYtCQFfevFbQXNi5btUdQZw/bgt4PxJCPJkCbQIOatFT/I0r
      6/ffr4TVyz/QVGRVAxg7AYbd/MO3+ENmNQHUtxJ0p1X2K/9272ij/ZaZgijGBBL5
      ouHeQcP52v7wBScJdr7SMqG40UuEjGat1yX0h/Um7VxAo+Sq9W6fdVdt1480Osn7
      o8GiTQ2AIQXNvP0OLuEkUsJ2OWEguomVY7YBec0sdRoW6XCpX30UAnYwlhZjE7dw
      PjFQU8UOE+yYEHQUUCYxT80Ui96kcoCUcf6hJNGZU7SbdcLsA2puuk6dYlPIJnR3
      2JZPY5JmaoygsAjm8bfqvnv8ky5PP+ce+1cEDeoCc6WvMn+zxthQYcHQP9YkUHeP
