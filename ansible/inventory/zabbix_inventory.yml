plugin: community.zabbix.zabbix_inventory
server_url: "http://192.168.50.6:8081"
login_user: "Admin"
login_password: "zabbix"
validate_certs: false

host_zapi_query:
  selectInterfaces:
    - ip
    - type
    - main
  groupids: ["27"]

compose:
  ansible_host: zbx_interfaces[0].ip

groups:
  lab_vms: true
  # Pare-feu Debian (fw-*) : pas de nginx dessus, le port 80 est redirigé vers le LAN.
  routers: inventory_hostname is match('fw-')
