---
# Crée/maintient les Job Templates AWX pour les playbooks principaux du lab.
# Auth attendue via env : CONTROLLER_HOST, CONTROLLER_OAUTH_TOKEN (voir ansible/awx/.env, gitignoré).
- name: AWX - Job Templates playbooks principaux
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    awx_organization: Default
    awx_project: homelab-infra
    awx_credential: ssh-homelab

  tasks:
    # Le credential lui-même (avec le token) se crée à la main dans l'UI AWX,
    # type "Proxmox API", nom "proxmox-api" : aucun secret dans le repo.
    - name: Credential type - Proxmox API (injection env pour community.proxmox)
      awx.awx.credential_type:
        name: Proxmox API
        description: "Token API Proxmox injecté en variables d'environnement PROXMOX_*"
        kind: cloud
        inputs:
          fields:
            - id: host
              type: string
              label: Hôte Proxmox
            - id: user
              type: string
              label: Utilisateur (ex. root@pam)
            - id: token_id
              type: string
              label: Token ID
            - id: token_secret
              type: string
              label: Token secret
              secret: true
            - id: validate_certs
              type: boolean
              label: Vérifier le certificat TLS
          required: [host, user, token_id, token_secret]
        injectors:
          env:
            PROXMOX_HOST: "{% raw %}{{ host | trim }}{% endraw %}"
            PROXMOX_USER: "{% raw %}{{ user | trim }}{% endraw %}"
            PROXMOX_TOKEN_ID: "{% raw %}{{ token_id | trim }}{% endraw %}"
            PROXMOX_TOKEN_SECRET: "{% raw %}{{ token_secret | trim }}{% endraw %}"
            PROXMOX_VALIDATE_CERTS: "{% raw %}{{ validate_certs | default(false) }}{% endraw %}"
        state: present

    - name: Execution Environment - homelab-ee (proxmoxer + collections du repo)
      awx.awx.execution_environment:
        name: homelab-ee
        description: "Défini dans ansible/ee/execution-environment.yml"
        image: ghcr.io/infocem22-ju/homelab-ee:1.0
        pull: missing
        organization: "{{ awx_organization }}"
        state: present

    # Les collections viennent de l'image homelab-ee, plus de requirements.yml : sans ça, chaque
    # mise à jour du projet sur un nouveau commit les retéléchargeait depuis Galaxy (de 1 à 18 min,
    # jobs bloqués en pending pendant ce temps). Réglage global à AWX.
    - name: Réglage AWX - pas de téléchargement des collections à la mise à jour des projets
      awx.awx.settings:
        name: AWX_COLLECTIONS_ENABLED
        value: false

    # Mise à jour à chaque lancement, sans cache : un job lancé par la CI déploie toujours le dernier commit.
    # default_environment : tous les Job Templates du projet tournent dans homelab-ee, sauf EE explicite.
    - name: Projet - homelab-infra (dépôt GitHub, branche master)
      awx.awx.project:
        name: "{{ awx_project }}"
        organization: "{{ awx_organization }}"
        scm_type: git
        scm_url: https://github.com/infocem22-ju/homelab-infra
        scm_branch: master
        scm_clean: false
        scm_update_on_launch: true
        scm_update_cache_timeout: 0
        allow_override: false
        default_environment: homelab-ee
        state: present

    # Le credential "zabbix-inventory-creds" (accès API Zabbix) se crée à la main dans l'UI AWX.
    # update_on_launch : sans lui, une VM qui change d'IP reste en cache et le job finit en unreachable.
    - name: Source d'inventaire - homelab-zabbix (plugin community.zabbix.zabbix_inventory)
      awx.awx.inventory_source:
        name: zabbix-source
        inventory: homelab-zabbix
        organization: "{{ awx_organization }}"
        source: scm
        source_project: "{{ awx_project }}"
        source_path: ansible/inventory/zabbix_inventory.yml
        # Le default_environment du projet ne vaut que pour les Job Templates : à donner ici aussi.
        execution_environment: homelab-ee
        credential: zabbix-inventory-creds
        update_on_launch: true
        overwrite: false
        verbosity: 1
        state: present

    - name: Job Template - Bootstrap VMs lab (zabbix-agent2)
      awx.awx.job_template:
        name: lab-vms-bootstrap
        description: "Bootstrap des VMs lab : installation/config zabbix-agent2"
        organization: "{{ awx_organization }}"
        project: "{{ awx_project }}"
        playbook: ansible/playbooks/bootstrap_lab_vms.yml
        inventory: homelab-zabbix
        credentials:
          - "{{ awx_credential }}"
        job_type: run
        state: present

    - name: Job Template - Arrêt propre des VMs lab
      awx.awx.job_template:
        name: lab-vms-shutdown
        description: "Arrêt propre des VMs lab via shutdown -h now"
        organization: "{{ awx_organization }}"
        project: "{{ awx_project }}"
        playbook: ansible/playbooks/shutdown_lab_vms.yml
        inventory: homelab
        credentials:
          - "{{ awx_credential }}"
        job_type: run
        state: present

    - name: Job Template - Provisioning des VMs lab sur Proxmox
      awx.awx.job_template:
        name: lab-vms-provision
        description: "Clone lab-template → lab-vm-1/2, cloud-init IP fixe, démarrage"
        organization: "{{ awx_organization }}"
        project: "{{ awx_project }}"
        playbook: ansible/playbooks/proxmox_provision_vms.yml
        inventory: homelab
        execution_environment: homelab-ee
        credentials:
          - proxmox-api
        job_type: run
        state: present

    - name: Job Template - Réseau de lab-crash-1 (LAN du site A ou VLAN invités)
      awx.awx.job_template:
        name: lab-crash-net
        description: "Branche lab-crash-1 sur le LAN ou les invités du site A ou B (lab_crash_net.yml)"
        organization: "{{ awx_organization }}"
        project: "{{ awx_project }}"
        playbook: ansible/playbooks/lab_crash_net.yml
        inventory: homelab
        credentials:
          - proxmox-api
        job_type: run
        survey_enabled: true
        survey_spec:
          name: ""
          description: ""
          spec:
            - question_name: Réseau de lab-crash-1
              variable: lab_crash_net
              type: multiplechoice
              choices: [lan-a, invites-a, lan-b, invites-b]
              default: invites-b
              required: true
        state: present

    - name: Job Template - Déploiement lab-site (déclenché par GitHub Actions)
      awx.awx.job_template:
        name: lab-site
        description: "Trace hôte + nginx + zabbix-agent2 sur les VMs lab (lab_site.yml)"
        organization: "{{ awx_organization }}"
        project: "{{ awx_project }}"
        playbook: ansible/playbooks/lab_site.yml
        inventory: homelab-zabbix
        # lab-crash-1 (scénarios d'incident) est souvent éteinte : exclue pour ne pas faire échouer le pipeline.
        limit: "lab_vms:!lab-crash-1"
        credentials:
          - "{{ awx_credential }}"
        job_type: run
        state: present
