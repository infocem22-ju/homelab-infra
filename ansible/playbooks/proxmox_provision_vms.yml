---
# Auth Proxmox via env (lue nativement par community.proxmox) :
#   PROXMOX_HOST, PROXMOX_USER, PROXMOX_TOKEN_ID, PROXMOX_TOKEN_SECRET
#   (optionnel : PROXMOX_VALIDATE_CERTS=false pour le certificat auto-signé)
# Dans AWX : credential de type "Proxmox API" (voir ansible/awx/job_templates.yml).
- name: Provision VMs sur Proxmox
  hosts: localhost
  gather_facts: false

  vars:
    proxmox_node: proxmox-lab
    # lab-vm-1 : LAN derrière OPNsense (vmbr1, passerelle et DNS = 10.10.10.1).
    # lab-vm-2 : reste côté WAN (vmbr0), protégée par son propre pare-feu (voir docs/pare-feu.md).
    # fw-debian : pare-feu Debian + nftables (site B), WAN sur vmbr0, LAN 10.10.20.0/24 sur vmbr2 (lan_*).
    # lab-vm-3 : LAN derrière fw-debian. DNS de libvirt, joint à travers le NAT de fw-debian.
    vms:
      - name: lab-vm-1
        newid: 101
        bridge: vmbr1
        ip: 10.10.10.101/24
        gw: 10.10.10.1
        dns: 10.10.10.1
      - name: lab-vm-2
        newid: 102
        bridge: vmbr0
        ip: 192.168.122.102/24
        gw: 192.168.122.1
        dns: 192.168.122.1
      - name: fw-debian
        newid: 120
        bridge: vmbr0
        ip: 192.168.122.120/24
        gw: 192.168.122.1
        dns: 192.168.122.1
        lan_bridge: vmbr2
        lan_ip: 10.10.20.1/24
      - name: lab-vm-3
        newid: 121
        bridge: vmbr2
        ip: 10.10.20.101/24
        gw: 10.10.20.1
        dns: 192.168.122.1

  tasks:
    - name: Vérifier que l'auth Proxmox est fournie par l'environnement
      ansible.builtin.assert:
        that: lookup('ansible.builtin.env', item) | length > 0
        fail_msg: "Variable d'environnement {{ item }} manquante"
        quiet: true
      loop:
        - PROXMOX_HOST
        - PROXMOX_USER
        - PROXMOX_TOKEN_ID
        - PROXMOX_TOKEN_SECRET

    - name: Cloner le template
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        clone: lab-template
        vmid: 9000
        newid: "{{ item.newid }}"
        name: "{{ item.name }}"
        full: true
        storage: local-lvm
        state: present
      loop: "{{ vms }}"
      register: clone_result

    - name: Lire la configuration réseau des VMs
      community.proxmox.proxmox_vm_info:
        node: "{{ proxmox_node }}"
        vmid: "{{ item.newid }}"
        config: current
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"
      register: vm_info

    # On ne réécrit une carte que si elle n'est pas sur le bon bridge, en gardant sa MAC :
    # une carte réécrite sans MAC en reçoit une nouvelle (et le bail DHCP change).
    # update_unsafe : sans lui, proxmox_kvm retire `net` de la mise à jour (erreur « no options specified »).
    - name: Brancher la carte réseau sur le bon bridge
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ item.item.newid }}"
        net:
          net0: "virtio{{ ('=' ~ nic_mac) if nic_mac else '' }},bridge={{ item.item.bridge }}"
        state: present
        update: true
        update_unsafe: true
      loop: "{{ vm_info.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      vars:
        nic_conf: "{{ item.proxmox_vms[0].config.net0 | default('') }}"
        nic_mac: "{{ nic_conf | regex_search('virtio=([0-9A-Fa-f:]{17})', '\\1') | default([''], true) | first }}"
      when: nic_conf is not search('bridge=' ~ item.item.bridge ~ '(,|$)')

    # Deuxième carte (LAN), pour un pare-feu.
    - name: Brancher la carte LAN
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ item.item.newid }}"
        net:
          net1: "virtio{{ ('=' ~ nic_mac) if nic_mac else '' }},bridge={{ item.item.lan_bridge }}"
        state: present
        update: true
        update_unsafe: true
      loop: "{{ vm_info.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      vars:
        nic_conf: "{{ item.proxmox_vms[0].config.net1 | default('') }}"
        nic_mac: "{{ nic_conf | regex_search('virtio=([0-9A-Fa-f:]{17})', '\\1') | default([''], true) | first }}"
      when:
        - item.item.lan_bridge is defined
        - nic_conf is not search('bridge=' ~ item.item.lan_bridge ~ '(,|$)')

    - name: Configurer cloud-init (IP fixe + gateway + DNS)
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ item.newid }}"
        ipconfig:
          ipconfig0: "ip={{ item.ip }},gw={{ item.gw }}"
        nameservers:
          - "{{ item.dns }}"
        state: present
        update: true
      loop: "{{ vms }}"

    - name: Configurer cloud-init (IP de la carte LAN)
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ item.newid }}"
        ipconfig:
          ipconfig1: "ip={{ item.lan_ip }}"
        state: present
        update: true
      loop: "{{ vms }}"
      when: item.lan_ip is defined

    - name: Démarrer les VMs
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ item.newid }}"
        state: started
      loop: "{{ vms }}"
