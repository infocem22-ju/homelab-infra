---
# Auth Proxmox via env (lue nativement par community.proxmox) :
#   PROXMOX_HOST, PROXMOX_USER, PROXMOX_TOKEN_ID, PROXMOX_TOKEN_SECRET
#   (optionnel : PROXMOX_VALIDATE_CERTS=false pour le certificat auto-signé)
# Dans AWX : credential de type "Proxmox API" (voir ansible/awx/job_templates.yml).
- name: Provision VMs sur Proxmox
  hosts: localhost
  gather_facts: false

  vars:
    proxmox_node: proxmox-lab
    vms:
      - name: lab-vm-1
        newid: 101
        ip: 192.168.122.101/24
      - name: lab-vm-2
        newid: 102
        ip: 192.168.122.102/24

  tasks:
    - name: Vérifier que l'auth Proxmox est fournie par l'environnement
      ansible.builtin.assert:
        that: lookup('ansible.builtin.env', item) | length > 0
        fail_msg: "Variable d'environnement {{ item }} manquante"
        quiet: true
      loop:
        - PROXMOX_HOST
        - PROXMOX_USER
        - PROXMOX_TOKEN_ID
        - PROXMOX_TOKEN_SECRET

    - name: Cloner le template
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        clone: lab-template
        vmid: 9000
        newid: "{{ item.newid }}"
        name: "{{ item.name }}"
        full: true
        storage: local-lvm
        state: present
      loop: "{{ vms }}"

    - name: Configurer cloud-init (IP fixe + gateway)
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ item.newid }}"
        ipconfig:
          ipconfig0: "ip={{ item.ip }},gw=192.168.122.1"
        state: present
        update: true
      loop: "{{ vms }}"

    - name: Démarrer les VMs
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ item.newid }}"
        state: started
      loop: "{{ vms }}"
