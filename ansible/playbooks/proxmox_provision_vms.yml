---
# Auth Proxmox via env (lue nativement par community.proxmox) :
#   PROXMOX_HOST, PROXMOX_USER, PROXMOX_TOKEN_ID, PROXMOX_TOKEN_SECRET
#   (optionnel : PROXMOX_VALIDATE_CERTS=false pour le certificat auto-signé)
# Dans AWX : credential de type "Proxmox API" (voir ansible/awx/job_templates.yml).
- name: Provision VMs sur Proxmox
  hosts: localhost
  gather_facts: false

  vars:
    proxmox_node: proxmox-lab
    # lab-vm-1 : LAN derrière OPNsense (vmbr1, passerelle et DNS = 10.10.10.1).
    # lab-vm-2 : reste côté WAN (vmbr0), protégée par son propre pare-feu (voir docs/pare-feu.md).
    vms:
      - name: lab-vm-1
        newid: 101
        bridge: vmbr1
        ip: 10.10.10.101/24
        gw: 10.10.10.1
        dns: 10.10.10.1
      - name: lab-vm-2
        newid: 102
        bridge: vmbr0
        ip: 192.168.122.102/24
        gw: 192.168.122.1
        dns: 192.168.122.1

  tasks:
    - name: Vérifier que l'auth Proxmox est fournie par l'environnement
      ansible.builtin.assert:
        that: lookup('ansible.builtin.env', item) | length > 0
        fail_msg: "Variable d'environnement {{ item }} manquante"
        quiet: true
      loop:
        - PROXMOX_HOST
        - PROXMOX_USER
        - PROXMOX_TOKEN_ID
        - PROXMOX_TOKEN_SECRET

    - name: Cloner le template
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        clone: lab-template
        vmid: 9000
        newid: "{{ item.newid }}"
        name: "{{ item.name }}"
        full: true
        storage: local-lvm
        state: present
      loop: "{{ vms }}"
      register: clone_result

    # Uniquement sur un clone neuf : réécrire net0 sans MAC en génère une nouvelle à chaque passage.
    - name: Brancher la carte réseau sur le bon bridge
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ item.item.newid }}"
        net:
          net0: "virtio,bridge={{ item.item.bridge }}"
        state: present
        update: true
      loop: "{{ clone_result.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.changed

    - name: Configurer cloud-init (IP fixe + gateway + DNS)
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ item.newid }}"
        ipconfig:
          ipconfig0: "ip={{ item.ip }},gw={{ item.gw }}"
        nameservers:
          - "{{ item.dns }}"
        state: present
        update: true
      loop: "{{ vms }}"

    - name: Démarrer les VMs
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ item.newid }}"
        state: started
      loop: "{{ vms }}"
