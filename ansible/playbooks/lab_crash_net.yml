---
# Bascule le réseau de lab-crash-1 (VM 103, sur vmbr1 d'OPNsense) entre le VLAN 40 (invités)
# et le LAN non étiqueté du site A (10.10.10.50, réservé dans le Dnsmasq d'OPNsense).
# Lancé par AWX (Job Template lab-crash-net, questionnaire lan / invites).
# Auth Proxmox via env, comme proxmox_provision_vms.yml (credential AWX proxmox-api).
- name: Réseau de lab-crash-1
  hosts: localhost
  gather_facts: false

  vars:
    proxmox_node: proxmox-lab
    lab_crash_vmid: 103
    lab_crash_net: invites
    lab_crash_tags:
      lan: ""
      invites: "40"

  tasks:
    - name: Vérifier le réseau demandé
      ansible.builtin.assert:
        that: lab_crash_net in lab_crash_tags
        fail_msg: "lab_crash_net doit valoir {{ lab_crash_tags.keys() | join(' ou ') }}"
        quiet: true

    - name: Lire la configuration de la VM
      community.proxmox.proxmox_vm_info:
        node: "{{ proxmox_node }}"
        vmid: "{{ lab_crash_vmid }}"
        config: current
      register: lab_crash_info

    # On ne touche qu'au tag : MAC (donc réservation DHCP), bridge et autres options restent.
    - name: Changer le tag VLAN de la carte
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ lab_crash_vmid }}"
        net:
          net0: "{{ nic_untagged ~ ((',tag=' ~ nic_tag) if nic_tag else '') }}"
        state: present
        update: true
        update_unsafe: true
      vars:
        nic_conf: "{{ lab_crash_info.proxmox_vms[0].config.net0 }}"
        nic_untagged: "{{ nic_conf | regex_replace(',tag=[0-9]+', '') }}"
        nic_tag: "{{ lab_crash_tags[lab_crash_net] }}"
      register: lab_crash_nic
      when: nic_conf != nic_untagged ~ ((',tag=' ~ nic_tag) if nic_tag else '')

    # Le tag change à chaud dans Proxmox, mais la VM garde son ancien bail :
    # un redémarrage lui fait redemander une adresse dans le nouveau réseau.
    - name: Redémarrer la VM (nouveau bail DHCP)
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ lab_crash_vmid }}"
        state: restarted
      when:
        - lab_crash_nic is changed
        - lab_crash_info.proxmox_vms[0].status == 'running'

    - name: Démarrer la VM
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_node }}"
        vmid: "{{ lab_crash_vmid }}"
        state: started

    - name: Réseau attendu
      ansible.builtin.debug:
        msg: >-
          lab-crash-1 sur {{ lab_crash_net }} :
          {{ '10.10.10.50 (LAN du site A)' if lab_crash_net == 'lan' else 'DHCP en 10.10.40.200-249 (invités)' }}
