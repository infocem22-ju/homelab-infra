# Drop-in systemd de libvirtd (poste) : /etc/systemd/system/libvirtd.service.d/homelab-nat.conf
# Au démarrage, libvirtd appelle le hook réseau, puis repose ses propres règles NAT
# au-dessus de celle du hook, qui ne sert alors plus à rien. On relance donc le hook
# une fois libvirtd prêt : il remet sa règle en tête. Voir bootstrap/libvirt-hooks/network.
[Service]
# « - » : un échec du hook ne doit jamais empêcher libvirtd de démarrer.
ExecStartPost=-/bin/sh -c 'sleep 2; /etc/libvirt/hooks/network default started'
